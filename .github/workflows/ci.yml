name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # No GROQ_API_KEY in CI on purpose: nothing in the test suite may depend on
      # a live model call. The API is expected to answer 503 on /upload here.
      NODE_ENV: test
      DATABASE_URL: file:./ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck (core, api, web)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate committed dataset
        # Fails only on rows no deterministic repair can fix; the 19 known
        # repairable rows are expected and reported, not fatal.
        run: npm run validate:dataset

      - name: Evaluate against the golden set (offline, no API calls)
        run: npm run eval -- --offline

      - name: Build
        run: npm run build

      - name: Verify migrations apply to an empty database
        run: npm run db:deploy

      - name: Verify the seed loads
        run: npm run db:seed
