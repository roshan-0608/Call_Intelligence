# Render Blueprint for the API.
#
# Two ways to use this file:
#
#   1. New service — Render dashboard → New → Blueprint → point it at this repo.
#      Everything below is applied automatically.
#   2. Existing service — Render does not read this file for services created
#      through the dashboard. Copy the values into Settings by hand; this file is
#      then the written record of what those settings are.
#
# The database choice is the one real decision here — see the notes on
# DATABASE_URL below.

services:
  - type: web
    name: call-intelligence-api
    runtime: node
    plan: free
    region: singapore # closest region to the calls in this dataset

    # Root directory stays the repository root: the API imports
    # @call-intel/shared, so npm has to install from where the workspaces are
    # declared. `build:api` compiles shared + backend only, skipping the
    # dashboard build, which Vercel handles.
    # --include=dev is required, not optional: NODE_ENV=production is set below
    # for the running server, and npm reads that during install too, skipping
    # devDependencies. TypeScript and @types/node live there, so without this
    # flag the build fails with "Cannot find type definition file for 'node'".
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:api

    # Migrations run on every boot: `migrate deploy` is idempotent and applies
    # only what is missing, which is what you want on a platform that can
    # replace the container at any time.
    preDeployCommand: npm run db:deploy

    startCommand: node backend/dist/index.js

    healthCheckPath: /health/live

    envVars:
      - key: NODE_ENV
        value: production

      # Off: the dashboard is served by Vercel, so this process is API-only and
      # keeps the API at the root (/calls, not /api/calls). Set to "on" instead
      # if you ever want one service to serve both.
      - key: SERVE_WEB
        value: 'off'

      - key: LLM_MODEL
        value: llama-3.1-8b-instant

      - key: PROMPT_VERSION
        value: v4

      - key: LOG_LEVEL
        value: info

      # The browser origin allowed to call this API. Must be the exact Vercel
      # URL, no trailing slash. Add a comma-separated second entry for previews.
      - key: CORS_ORIGINS
        sync: false

      # Set in the dashboard, never committed. Without it the API still serves
      # all 150 calls read-only and /upload returns a clear 503.
      - key: GROQ_API_KEY
        sync: false

      # Neon PostgreSQL connection string, set in the dashboard.
      #
      # Postgres rather than SQLite because Render's filesystem is ephemeral: a
      # SQLite file is deleted whenever the container restarts, which would lose
      # every uploaded call. Run `npm run db:deploy` (already the pre-deploy
      # command) and `npm run db:seed` once to load the 150 committed calls.
      - key: DATABASE_URL
        sync: false
